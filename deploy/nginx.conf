# ==================== 吞噬星空 RAG 助手 - Nginx 反向代理 ====================
# 挂载到容器 /etc/nginx/conf.d/default.conf
# 关键点：proxy_buffering off + proxy_cache off 关闭缓冲，保证流式打字机在线生效

# HTTP 入口（如需 HTTPS，可在此配置 ssl 证书或再用一层 443 server）
server {
    listen 80;
    server_name _;

    # 前端静态资源较大或较多时，可加 gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    location / {
        proxy_pass http://app:3000;          # compose 服务名访问应用容器
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ===== 流式输出必需：关闭缓冲与缓存 =====
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;              # 长响应（LLM 生成）避免被掐断
        chunked_transfer_encoding on;
    }
}