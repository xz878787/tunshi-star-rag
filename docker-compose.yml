# ==================== 吞噬星空 RAG 助手 - 一键部署编排 ====================
version: "3.8"   # 兼容服务器上的老版 docker-compose v1（v2 会提示过时但可忽略）
# 用法：
#   1. 在 docker-compose.yml 同级放置 .env（参照 .env.example 填写真实值）
#   2. 导入 tsxkrag-app 镜像后启动：docker-compose up -d
#   3. 浏览器访问：https://rag.xz878787.cn
#
# 服务组成：
#   mysql —— MySQL 业务数据库（Compose 自动创建并持久化）
#   app   —— Node + Express + RAG 主服务
#   nginx —— 反向代理（关闭缓冲，保证流式打字机效果）

services:
  # ---------- 业务数据库 ----------
  mysql:
    image: mysql:8.0
    container_name: rag-mysql8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- 主应用（Node + Express + RAG）----------
  app:
    image: tsxkrag-app:latest
    container_name: tsxkrag-app
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: mysql                  # Compose 服务名，使用容器内 3306
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      MODEL_NAME: ${MODEL_NAME}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      EMBEDDINGS_MODEL_NAME: ${EMBEDDINGS_MODEL_NAME}
      MILVUS_ADDRESS: ${MILVUS_ADDRESS}
      MILVUS_TOKEN: ${MILVUS_TOKEN}
      BOCHA_API_KEY: ${BOCHA_API_KEY}       # 博查联网兜底：缺了会静默跳过联网
      PLAN_MODEL_NAME: ${PLAN_MODEL_NAME}   # 规划/路由/拆解用小模型，缺了回落主模型（变慢变贵）
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "3000"                        # 仅供 nginx 访问，不直接暴露公网

  # ---------- 反向代理（对外唯一入口）----------
  nginx:
    image: nginx:alpine
    container_name: tsxkrag-nginx
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  mysql-data:
